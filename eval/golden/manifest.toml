# Golden corpus manifest (ARCHITECTURE.md §17.1).
#
# The corpus that the three-arm gate (§17.2) runs on. Target is ~200 labelled
# episodes across note / document / agent-trace shapes and ~100 questions with
# reference answers + required supporting episodes. This manifest lists what
# exists; the categories are the two the gate reports (c) − (b) on.
#
# The three gate arms:
#   (a) full context, no retrieval   — ceiling
#   (b) lexical + dense chunks + RRF, no knowledge graph — control
#   (c) oxibrain complete            — treatment
# Reported quantity: (c) − (b) per category, with tokens/query alongside.
#
# Current corpus: 25 episodes (en/ko/zh), 25 questions, 52 declarations.
# The full ~200/~100 corpus is human-curated content added incrementally.

version = "0.2"

[[categories]]
name = "knowledge_update"
description = "A later episode changes a belief; the brain must answer with the updated value."

[[categories]]
name = "graph_reasoning"
description = "The answer requires traversing the knowledge graph; the answer entity is not mentioned in the question so lexical-only search cannot find it."

