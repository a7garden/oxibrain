# §5.1 ranking-tolerance probe set (ARCHITECTURE.md §5.1, §7.8).
#
# A fixed probe set used to CALIBRATE the ranking-half tolerance from the
# measured cross-backend variance of the shipped quantized encoder
# (CPU vs. Metal, recall@10). The tolerance is `max(2pp, 2 × observed_max_delta)`.
#
# IMPORTANT: this file is the measurement fixture. Do not edit it after the
# tolerance is recorded — editing changes the measurement. The entities span
# the writing-system property classes of §7.8 (Latin, Hangul, Han, Kana, Arabic,
# Thai) so the encoder is exercised across scripts, not just English.
#
# Entities are retrieved by embedding their `text`; queries are embedded and
# ranked against the entities by cosine similarity. Each query declares the
# entity ids that are ground-truth relevant, so recall@10 is well-defined.

