# Experience-memory corpus (doc/spec/experience-memory-v1.md §5, M11).
#
# Two environments sharing the task base name "deploy" (environment-qualified
# surfaces), English + Korean content, gold statements over the experience
# predicate family. Ingested declaratively by `oxibrain eval --suite
# experience` — deterministic, no LLM. Questions are scored per category
# (workflow / gotcha / premise / static / dynamic) across arms:
#   a = full-context ceiling, b = lexical statements, c = hybrid + expansion,
#   r = recall (full stack, 2,000-token budget).
version = "1"
read_at = "2026-10-01"

[[categories]]
name = "workflow"
description = "Ordered procedure knowledge — lives in episode content, not statements."

[[categories]]
name = "gotcha"
description = "Recurring failure conditions (fails_when / failed_because)."

[[categories]]
name = "premise"
description = "Assumptions valid elsewhere, wrong here (premise_differs / assumed)."

[[categories]]
name = "static"
description = "Stable prerequisites (requires)."

[[categories]]
name = "dynamic"
description = "Time-scoped answers (as_of over the bi-temporal fold)."

