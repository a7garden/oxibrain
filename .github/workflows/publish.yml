name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.85

      - name: Install llama.cpp build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

      - name: Assert tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          V=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[].version' | sort -u)
          if [ "$TAG" != "$V" ]; then
            echo "tag v$TAG does not match workspace version $V — a full-skip false green would follow"
            exit 1
          fi

      - name: Verify workspace builds
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish.sh

      - name: Consumer smoke (published crates resolve from the registry)
        run: |
          dir=$(mktemp -d)
          cargo new --lib "$dir/consumer" --name oxibrain_consumer
          cd "$dir/consumer"
          # oxibrain-cli ships the actual `oxibrain` binary users install — the
          # facade/mcp/client libs alone would not catch a broken CLI publish.
          cargo add --quiet oxibrain oxibrain-client oxibrain-mcp oxibrain-cli
          cargo check --quiet
          echo "consumer smoke ok: latest published oxibrain stack (incl. cli) resolves and compiles"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
