name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.96

      - name: Install llama.cpp build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

      - name: Assert tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          V=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[].version' | sort -u)
          if [ "$TAG" != "$V" ]; then
            echo "tag v$TAG does not match workspace version $V — a full-skip false green would follow"
            exit 1
          fi

      - name: Verify workspace builds
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish.sh

      # Published crates re-resolve dependencies fresh from the registry (no
      # lock file ships), so they must also compile on a recent toolchain —
      # not just our MSRV 1.96. The smoke runs on stable (currently ≥1.96),
      # which also catches versions the pinned CI toolchain has not seen.
      - name: Consumer smoke (published crates resolve from the registry)
        run: |
          rustup toolchain install stable --profile minimal
          dir=$(mktemp -d)
          cargo +stable new --lib "$dir/consumer" --name oxibrain_consumer
          cd "$dir/consumer"
          # oxibrain-cli ships the actual `oxibrain` binary users install — the
          # facade/mcp/client libs alone would not catch a broken CLI publish.
          cargo +stable add --quiet oxibrain oxibrain-client oxibrain-mcp oxibrain-cli
          cargo +stable check --quiet
          echo "consumer smoke ok: latest published oxibrain stack (incl. cli) resolves and compiles"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  # oxios's BrainInstaller downloads `releases/latest` and expects exactly
  # `oxibrain-aarch64-apple-darwin.tar.gz` (+ `.sha256`, BSD `digest  file`
  # form) containing a top-level `oxibrain` entry — keep the names in sync
  # with oxios-kernel brain/installer.rs ASSET_TAR.
  release-binary:
    name: Release binary (aarch64-apple-darwin)
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.96

      - uses: Swatinem/rust-cache@v2

      # mlx-sys compiles MLX's Metal kernels, which need recent Metal
      # shader headers (metal::remove_addrspace_t); the macos-14 default
      # Xcode is older than that.
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Build release binary
        run: cargo build --release -p oxibrain-cli

      - name: Build MLX release binary
        run: cargo build --release -p oxibrain-cli --features mlx

      - name: Package tarballs and checksums
        run: |
          dir=$(mktemp -d)
          cp target/release/oxibrain "$dir/oxibrain"
          tar -czf "oxibrain-aarch64-apple-darwin.tar.gz" -C "$dir" oxibrain
          shasum -a 256 "oxibrain-aarch64-apple-darwin.tar.gz" \
            > "oxibrain-aarch64-apple-darwin.tar.gz.sha256"
          # MLX engine build: same binary plus the in-process MLX engine
          # (ADR-017). The GGUF embedder is unavailable in this build.
          cp target/release/oxibrain "$dir/oxibrain-mlx"
          tar -czf "oxibrain-mlx-aarch64-apple-darwin.tar.gz" -C "$dir" oxibrain-mlx
          shasum -a 256 "oxibrain-mlx-aarch64-apple-darwin.tar.gz" \
            > "oxibrain-mlx-aarch64-apple-darwin.tar.gz.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" \
            "oxibrain-aarch64-apple-darwin.tar.gz" \
            "oxibrain-aarch64-apple-darwin.tar.gz.sha256" \
            "oxibrain-mlx-aarch64-apple-darwin.tar.gz" \
            "oxibrain-mlx-aarch64-apple-darwin.tar.gz.sha256" \
            --clobber
