name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.85

      - name: Install llama.cpp build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

      - name: Assert tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          V=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[].version' | sort -u)
          if [ "$TAG" != "$V" ]; then
            echo "tag v$TAG does not match workspace version $V — a full-skip false green would follow"
            exit 1
          fi

      - name: Verify workspace builds
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish.sh

      - name: Consumer smoke (published crates resolve from the registry)
        run: |
          dir=$(mktemp -d)
          cargo new --lib "$dir/consumer" --name oxibrain_consumer
          cd "$dir/consumer"
          cargo add --quiet oxibrain oxibrain-client oxibrain-mcp
          cargo check --quiet
          echo "consumer smoke ok: latest published oxibrain stack resolves and compiles"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  binary:
    name: Build macOS arm64 binary
    runs-on: macos-14
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.85

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p oxibrain-cli

      - name: Smoke test
        run: ./target/release/oxibrain --version

      - name: Package and checksum
        run: |
          set -euo pipefail
          ASSET=oxibrain-aarch64-apple-darwin.tar.gz
          tar -C target/release -czf "$ASSET" oxibrain
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          ls -lh "$ASSET" "$ASSET.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oxibrain-aarch64-apple-darwin.tar.gz
            oxibrain-aarch64-apple-darwin.tar.gz.sha256
