name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install llama.cpp build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      - name: Verify workspace builds
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            local crate="$1"; shift
            local extra=("$@")
            local out
            for attempt in 1 2 3 4 5 6; do
              echo "::group::Publish $crate (attempt $attempt)"
              if out=$(cargo publish "${extra[@]}" -p "$crate" 2>&1); then
                echo "$out"
                echo "::endgroup::"
                echo "✅ $crate"
                return 0
              fi
              echo "$out"
              echo "::endgroup::"
              # Already at this version — idempotent skip (e.g. re-run).
              if echo "$out" | grep -qE "already (uploaded|exists)"; then
                echo "⏭️ $crate (already published at this version)"
                return 0
              fi
              # crates.io rate-limits new-crate publishes; back off and retry.
              sleep $((attempt * 120))
            done
            echo "❌ $crate failed after 6 attempts"
            return 1
          }
          publish oxibrain-ports
          publish oxibrain-index
          publish oxibrain-core
          publish oxibrain-store
          publish oxibrain-views
          publish oxibrain-embed-local --no-verify
          publish oxibrain-llm-http
          publish oxibrain-llm-local --no-verify
          publish oxibrain-connectors
          publish oxibrain-client
          publish oxibrain-mcp
          publish oxibrain-cli
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --generate-notes || true
