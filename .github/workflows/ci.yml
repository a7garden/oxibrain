name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
      - name: standalone build
        run: cargo build -p oxibrain --no-default-features --features http-llm
      - name: standalone guarantee (no oxi crates)
        run: |
          if cargo tree -p oxibrain | grep -E 'oxios-|oxicode-'; then
            echo "oxi-ecosystem crate leaked into default build"; exit 1
          fi
      - name: rusqlite isolation (core, views, facade src only)
        run: |
          if grep -rn 'use rusqlite' --include='*.rs' \
             crates/oxibrain-core/src crates/oxibrain-views/src crates/oxibrain/src; then
            echo "rusqlite referenced in core/views/facade production code"; exit 1
          fi
      - name: test
        run: cargo test --all-features