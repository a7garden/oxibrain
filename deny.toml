[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# instant v0.1.13 — unmaintained (RUSTSEC-2024-0384). Transitive via
# notify-types → notify v7 (file watcher). No patched upgrade exists;
# notify would have to drop notify-types or vendor web-time. Not a
# vulnerability (no exploitable path in a local file watcher), so the
# standard unmaintained-ignore applies until notify ships a fix.
ignore = ["RUSTSEC-2024-0384"]
[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "Zlib", "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
