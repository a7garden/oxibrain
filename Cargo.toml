[workspace]
resolver = "2"
members = [
    "crates/oxibrain-ports",
    "crates/oxibrain-core",
    "crates/oxibrain-index",
    "crates/oxibrain-store",
    "crates/oxibrain",
    "crates/oxibrain-cli",
    "crates/oxibrain-llm-http",
    "crates/oxibrain-llm-local",
    "crates/oxibrain-mcp",
    "crates/oxibrain-client",
    "crates/oxibrain-connectors",
    "crates/oxibrain-embed-local",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
oxibrain = { path = "crates/oxibrain", version = "0.1.0" }
oxibrain-core = { path = "crates/oxibrain-core", version = "0.1.0" }
oxibrain-index = { path = "crates/oxibrain-index", version = "0.1.0" }
oxibrain-ports = { path = "crates/oxibrain-ports", version = "0.1.0" }
oxibrain-llm-http = { path = "crates/oxibrain-llm-http", version = "0.1.0" }
oxibrain-llm-local = { path = "crates/oxibrain-llm-local", version = "0.1.0" }
oxibrain-mcp = { path = "crates/oxibrain-mcp", version = "0.1.0" }
oxibrain-client = { path = "crates/oxibrain-client", version = "0.1.0" }
oxibrain-connectors = { path = "crates/oxibrain-connectors", version = "0.1.0" }
oxibrain-store = { path = "crates/oxibrain-store", version = "0.1.0" }
oxibrain-embed-local = { path = "crates/oxibrain-embed-local", version = "0.1.0" }
blake3 = "1.5"
hex = "0.4"
unicode-normalization = "0.1"
fs2 = "0.4"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
anyhow = "1"
criterion = { version = "0.5", features = ["html_reports"] }
llama-cpp-2 = { version = "0.1", features = ["sampler"] }
encoding_rs = "0.8"

[profile.release]
lto = "thin"
