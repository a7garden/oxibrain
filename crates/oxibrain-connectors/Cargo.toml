toml.workspace = true
blake3.workspace = true
hex.workspace = true
thiserror.workspace = true
oxibrain-core.workspace = true
oxibrain-ports.workspace = true
gix = { workspace = true, features = ["excludes"] }

[dev-dependencies]
gix = { workspace = true, features = ["excludes", "tree-editor"] }
tempfile.workspace = true
